name: iOS - Signed IPA and TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed IPA to App Store Connect / TestFlight
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ios-apple-distribution
  cancel-in-progress: false

jobs:
  release:
    # Distribution only runs against the repository's default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: com.cihanemre.SheepCrate3D
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select installed release Xcode 26 or newer
        run: bash ci/select-xcode.sh
      - name: Validate and install signing materials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash ci/install-signing.sh
      - name: Archive and export IPA
        run: bash ci/archive.sh
      - name: Save IPA and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: SheepCrate-signed-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/export/*.ipa
            build/SheepCrate.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 7
      - name: Upload to App Store Connect
        if: inputs.upload_to_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash ci/upload-testflight.sh
      - name: Save archive and export logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing credentials
        if: always()
        run: bash ci/cleanup.sh
